# Workspace root — virtual (not itself a package).
# All Python packages live in libs/*, services/*, and cli/ (architecture.md §9).

[tool.uv.workspace]
members = ["libs/*", "services/*", "cli"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

# ---------------------------------------------------------------------------
# Shared lint / format / type-check configuration (architecture.md §16).
# Member packages inherit these by convention: CI runs ruff/pyright from the
# workspace root against the whole tree.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["libs/*/src", "services/*/src", "cli/src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez — naive datetimes are a bug by policy (P9)
    "RUF",  # ruff-specific
]
ignore = [
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ARG001", "ARG002"]  # fixtures often accept unused args

[tool.pyright]
include = ["libs", "services", "cli"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules", "**/build"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["libs", "services", "cli"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that need external infrastructure (Docker, Mongo, Joern)",
]
