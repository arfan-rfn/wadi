name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  scala:
    name: joern-platform (scala)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Conformance tests (petstore + lombok fixtures)
        working-directory: joern-platform
        run: sbt -batch test
      - name: Assembly (the jar shipped in the wadi-joern image)
        working-directory: joern-platform
        run: sbt -batch assembly
      - name: Upload real export for the cross-language golden test
        uses: actions/upload-artifact@v4
        with:
          name: petstore-export
          path: joern-platform/target/petstore-export/export.json
          if-no-files-found: error

  python:
    name: workspace (python)
    runs-on: ubuntu-latest
    needs: scala
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Download real Joern export (golden test input)
        uses: actions/download-artifact@v4
        with:
          name: petstore-export
          path: joern-platform/target/petstore-export
      - run: uv sync --all-packages
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Typecheck (pyright strict)
        run: uv run pyright
      - name: Tests (unit + integration; Mongo runs in Docker)
        run: uv run pytest -q
      - name: Contract schemas are not stale (§7)
        run: |
          uv run --package wadi-contracts python libs/wadi-contracts/scripts/export_schema.py --out schemas/
          git diff --exit-code schemas/
      - name: CLI-embedded compose matches infra source of truth (§15)
        run: |
          make sync-compose
          git diff --exit-code cli/src/wadi_cli/resources/
      - name: License scan (§12 hygiene)
        run: |
          uv run --with pip-licenses pip-licenses --format=csv \
            | tail -n +2 | grep -iE 'GPL' | grep -viE 'LGPL' \
            && { echo "GPL-licensed dependency found"; exit 1; } || true

  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --package wadi-contracts
      - name: Regenerate schemas + TS types
        run: |
          uv run --package wadi-contracts python libs/wadi-contracts/scripts/export_schema.py --out schemas/
          cd frontend && npm ci --no-audit --no-fund && npm run generate-types
      - name: Generated types are not stale (§7)
        run: git diff --exit-code frontend/lib/generated/
      - name: Typecheck + build
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npm run build

  e2e:
    name: vertical-slice e2e (real Joern)
    runs-on: ubuntu-latest
    needs: [scala, python]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - name: Read VERSION (the e2e image tag must match the compose pin)
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build the wadi-joern image (pinned Joern + wadi jar)
        uses: docker/build-push-action@v6
        with:
          context: joern-platform
          tags: ghcr.io/wadi-sh/joern:${{ steps.version.outputs.version }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: uv sync --all-packages
      - name: Run the conformance e2e (§11.8)
        run: uv run pytest e2e -q
