[project]
name = "wadi-stitcher"
version = "0.7.4"
description = "Wadi stitcher: cross-service graph assembly (architecture.md §5.4). Phase 1: skeleton pipeline."
requires-python = ">=3.12"
dependencies = [
    "wadi-contracts",
    "wadi-storage",
    "wadi-config",
]

[project.scripts]
wadi-stitcher = "wadi_stitcher.main:main"

[tool.uv.sources]
wadi-contracts = { workspace = true }
wadi-storage = { workspace = true }
wadi-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_stitcher"]
