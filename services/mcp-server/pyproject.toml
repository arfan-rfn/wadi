[project]
name = "wadi-mcp-server"
version = "0.5.3"
description = "Wadi MCP server: architecture-level tools for coding agents (architecture.md §8)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "wadi-contracts",
    "wadi-storage",
    "wadi-config",
]

[project.scripts]
wadi-mcp = "wadi_mcp.main:main"

[tool.uv.sources]
wadi-contracts = { workspace = true }
wadi-storage = { workspace = true }
wadi-config = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_mcp"]
