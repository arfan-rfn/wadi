[project]
name = "wadi-orchestrator"
version = "0.5.0"
description = "Wadi orchestrator: systems/snapshots/jobs owner + /api/v1 read API (architecture.md §5.3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "wadi-contracts",
    "wadi-storage",
    "wadi-config",
    "wadi-repo",
]

[project.scripts]
wadi-orchestrator = "wadi_orchestrator.app:main"

[tool.uv.sources]
wadi-contracts = { workspace = true }
wadi-storage = { workspace = true }
wadi-config = { workspace = true }
wadi-repo = { workspace = true }

[dependency-groups]
dev = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_orchestrator"]
