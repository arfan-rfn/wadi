[project]
name = "wadi-sh"
version = "0.1.1"
description = "The wadi command: compose-wrapper + REST client, nothing more (architecture.md §15)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Deliberately tiny dependency tree (§15): never wadi-storage, never DB drivers.
# wadi-contracts is pinned exactly — it is version-paired with this package per
# release (§13), and both publish to PyPI from the same tag.
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "rich>=13.9",
    "pydantic>=2.10",
    "wadi-contracts==0.1.1",
]

[project.scripts]
wadi = "wadi_cli.main:app"

[tool.uv.sources]
wadi-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_cli"]
