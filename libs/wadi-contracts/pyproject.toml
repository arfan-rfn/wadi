[project]
name = "wadi-contracts"
version = "0.8.2"
description = "Wadi data contracts: the Pydantic models that are the single source of truth (architecture.md §7)"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_contracts"]
