[project]
name = "wadi-storage"
version = "0.2.0"
description = "Wadi storage seam: Mongo + Neo4j repositories and the job queue. The ONLY package importing DB drivers (architecture.md §9)."
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.10",
    "neo4j>=5.27",
    "pydantic>=2.10",
    "wadi-contracts",
]

[tool.uv.sources]
wadi-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_storage"]
