[project]
name = "wadi-joern-client"
version = "0.7.1"
description = "Thin CPGQL-server client + the Scala<->Python bulk-export contract (architecture.md §5.1)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_joern_client"]
