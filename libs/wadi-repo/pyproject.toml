[project]
name = "wadi-repo"
version = "0.5.1"
description = "Wadi git intake: bare-clone cache, SHA pinning, worktree materialization, path deltas (architecture.md §3)"
requires-python = ">=3.12"
dependencies = [
    "wadi-contracts",
]

[tool.uv.sources]
wadi-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_repo"]
