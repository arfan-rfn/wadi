[project]
name = "wadi-testing"
version = "0.5.2"
description = "Shared test infrastructure: Mongo container fixtures + contract builders. Never shipped in images."
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3",
    "wadi-contracts",
    "wadi-storage",
]

[tool.uv.sources]
wadi-contracts = { workspace = true }
wadi-storage = { workspace = true }

[project.entry-points.pytest11]
wadi_testing = "wadi_testing.fixtures"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadi_testing"]
